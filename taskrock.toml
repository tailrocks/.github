[[routing.model]]
name = "claude-haiku-5-5"
runtimes = ["claude"]
efforts = ["low", "medium", "high", "xhigh", "max"]
use = "Mechanical work: docs, renames, config, tests that follow an existing pattern."

[[routing.model]]
name = "claude-sonnet-5-5"
runtimes = ["claude"]
efforts = ["low", "medium", "high", "xhigh", "max"]
use = "The default builder."

[[routing.model]]
name = "claude-opus-5-5"
runtimes = ["claude"]
efforts = ["low", "medium", "high", "xhigh", "max"]
use = "Rare as a builder: only a design-heavy or cross-module task, with the reason in the plan. The default reviewer."

[[routing.model]]
name = "muse-spark-1.3"
runtimes = ["muse"]
efforts = ["minimal", "low", "medium", "high", "xhigh", "max"]
use = "Tasks run in Muse Code."

[[routing.model]]
name = "muse-ember-1.0"
runtimes = ["muse"]
efforts = ["minimal", "low", "medium", "high", "xhigh", "max"]
use = "Tasks run in Muse Code."

[[routing.model]]
name = "muse-wonder-1.0"
runtimes = ["muse"]
efforts = ["minimal", "low", "medium", "high", "xhigh", "max"]
use = "Tasks run in Muse Code."

[[routing.model]]
name = "muse-wonder-full-1.0"
runtimes = ["muse"]
efforts = ["minimal", "low", "medium", "high", "xhigh", "max"]
use = "Tasks run in Muse Code."

[review]
max_rounds = 3

[[issue_type]]
name = "Initiative"
file = ["Outcome", "Why", "Not yet specified", "Out of scope", "Done when"]
build = ["Outcome", "Why", "Not yet specified", "Out of scope", "Done when"]
checklist = ["Done when"]

[[issue_type]]
name = "Epic"
file = ["Outcome", "Decisions already made", "Not yet specified", "Out of scope", "Done when"]
build = ["Outcome", "Decisions already made", "Not yet specified", "Out of scope", "Done when"]
checklist = ["Done when"]

[[issue_type]]
name = "Task"
file = ["Outcome", "Decisions already made", "Steps", "Done when", "Out of scope"]
build = ["Outcome", "Decisions already made", "Steps", "Done when", "Out of scope"]
checklist = ["Done when"]

[[issue_type]]
name = "Bug"
file = ["What happens", "Expected", "How to reproduce", "Environment"]
build = ["What happens", "Expected", "How to reproduce", "Environment", "Cause", "Decisions already made", "Steps", "Done when", "Out of scope"]
checklist = ["Done when"]

[[issue_type]]
name = "Feature"
file = ["Problem", "Proposed behavior", "Workaround today"]
build = ["Problem", "Proposed behavior", "Workaround today", "Decisions already made", "Steps", "Done when", "Out of scope"]
checklist = ["Done when"]

[owner_task]
file = ["Outcome", "Question", "Why it matters", "Recommended answer", "Done when"]
build = ["Outcome", "Question", "Why it matters", "Recommended answer", "Done when"]
checklist = ["Done when"]

[[project]]
key = "taskrock"
title = "taskrock"
kind = "delivery"
number = 3
repos = ["taskrock", "taskrock-plugins", "taskrock-sandbox"]

[project.workflows]
auto_add_sub_issues = true
item_added = true
item_closed = true
pr_linked = true
pr_merged = true
auto_close_issue = true

